<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Linktree</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">

    <!-- Container Principal -->
    <main class="main-container">
        
        <!-- Foto de Perfil -->
        <div class="profile-wrapper group">
            <div class="profile-glow"></div>
            <img class="profile-image" src="https://unsplash.com" alt="Sua Foto de Perfil">
        </div>

        <!-- Informações do Perfil -->
        <h1 class="profile-title">Alex Silva</h1>
        <p class="profile-subtitle">Desenvolvedor Full Stack & Criador de Conteúdo</p>

        <!-- Links Principais -->
        <div class="links-list">
            
            <!-- Link Normal 1 -->
            <a href="#" target="_blank" class="link-item group">
                <span class="link-text">Meu Portfólio</span>
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="link-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </a>

            <!-- Link Normal 2 -->
            <a href="#" target="_blank" class="link-item group">
                <span class="link-text">Último Artigo no Blog</span>
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="link-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </a>

            <!-- Link de Destaque (Gradiente) -->
            <a href="#" target="_blank" class="link-highlight group">
                <span class="link-highlight-inner">
                    <span class="link-text-gradient">Inscreva-se no Canal 🚀</span>
                    <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="link-icon-gradient">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </span>
            </a>

        </div>

        <!-- Redes Sociais Menores -->
        <div class="social-footer">
            <a href="#" class="social-link">LinkedIn</a>
            <a href="#" class="social-link">Twitter</a>
            <a href="#" class="social-link">Instagram</a>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="page-footer">
        Feito com ❤️, HTML e CSS
    </footer>

</body>
</html>
